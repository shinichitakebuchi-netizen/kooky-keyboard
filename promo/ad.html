<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>綴 コンセプト動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 綴（つづり）コンセプト動画：日本 × ミニマリスト
   色は日本の伝統色だけ（藍色・鳥の子色・甕覗・利休鼠・紅緋）。1080×1920 の縦長で設計 */
:root {
  --ai: #264348;          /* 藍色：背景 */
  --tori: #E2BE9F;        /* 鳥の子色：文字（主） */
  --kame: rgba(198,194,182,.7); /* 甕覗 70%：文字（補足） */
  --rikyu: #656255;       /* 利休鼠：罫線 */
  --benihi: #F35336;      /* 紅緋：見出し・強調 */
  --mincho: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--ai); }
body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
#wrap { width: 1080px; height: 1920px; transform-origin: center center; flex: none; }
#stage { position: relative; width: 1080px; height: 1920px; background: var(--ai); overflow: hidden; color: var(--tori); font-family: var(--gothic); }
.abs { position: absolute; }
.o0 { opacity: 0; }

/* ---- 綴じ糸のしるし（アイコンと同じ形） ---- */
.mark line { stroke-linecap: round; }

/* ---- 表題 ---- */
.title { font-family: var(--mincho); font-weight: 600; color: var(--tori); line-height: 1; }
.yomi { font-family: var(--mincho); color: var(--kame); letter-spacing: .5em; }

/* ---- 縦書きの言葉 ---- */
.tate { writing-mode: vertical-rl; font-family: var(--mincho); line-height: 1.7; letter-spacing: .18em; }
.tate span { display: inline-block; }

/* ---- 入力欄 ---- */
#field { left: 90px; top: 700px; width: 640px; }
#fieldText { font-size: 46px; line-height: 1.6; min-height: 148px; color: var(--tori); letter-spacing: .02em; }
#fieldText .comp { border-bottom: 3px solid var(--tori); }
#fieldText .raw { color: var(--kame); }
#caret { display: inline-block; width: 3px; height: 50px; background: var(--benihi); vertical-align: -8px; margin-left: 4px; }
#fieldLine { height: 2px; background: var(--rikyu); margin-top: 18px; }

/* ---- キーボード（アプリの「藍」配色の見た目をそのまま写す：360dp幅の端末を3倍で） ---- */
#kb { left: 0; top: 1068px; width: 1080px; height: 852px;
  --kbg: #264348; --ktext: #E2BE9F; --ksub: rgba(198,194,182,.7); --kline: #656255; --kacc: #F35336; --kon: #264348;
  background: var(--kbg); font-family: var(--gothic); }
#tool { position: absolute; left: 9px; right: 9px; top: 9px; height: 114px; display: flex; }
#tool .sp { flex: 1; }
.tb { width: 120px; height: 114px; flex: none; box-sizing: border-box; border: 1.5px solid var(--kline); border-radius: 9px; display: flex; align-items: center; justify-content: center; margin-left: 12px; }
.tb:first-child { margin-left: 0; }
.tb svg { width: 66px; height: 66px; fill: none; stroke: var(--ksub); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb.on { background: var(--kacc); border-color: var(--kacc); }
.tb.on svg { stroke: var(--kon); }
.tb.prs { background: rgba(226,190,159,.18); }
#cand { position: absolute; left: 9px; right: 9px; top: 9px; height: 114px; display: flex; gap: 12px; opacity: 0; overflow: hidden; }
.cc { flex: none; height: 114px; box-sizing: border-box; padding: 0 30px; border: 1.5px solid var(--kline); border-radius: 9px; display: flex; align-items: center; font-size: 45px; color: var(--ktext); white-space: nowrap; }
.cc.on { background: var(--kacc); border-color: var(--kacc); color: var(--kon); font-weight: 700; }
#grid { position: absolute; left: 9px; right: 9px; top: 129px; height: 624px; box-sizing: border-box; padding: 6px; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); grid-template-rows: repeat(4, minmax(0,1fr)); gap: 12px; }
.k { box-sizing: border-box; border: 1.5px solid var(--kline); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 60px; color: var(--ktext); position: relative; will-change: transform; background: var(--kbg); }
.k.s { font-size: 42px; }
.k svg { width: 66px; height: 66px; fill: none; stroke: var(--ktext); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.k svg .f { fill: var(--ktext); stroke: none; }
.k.ent { background: var(--kacc); border-color: var(--kacc); color: var(--kon); font-size: 45px; }
.k.ent svg { width: 72px; height: 72px; stroke: var(--kon); stroke-width: 2.3; }
.k .hl { position: absolute; inset: 0; background: var(--ktext); opacity: 0; border-radius: 7px; }
.k .mode b { color: var(--kacc); font-size: 52px; font-weight: 700; }
.k .mode i { color: var(--ksub); font-size: 36px; font-style: normal; }

/* ---- 定型文パネル（中央の3列の場所に出る。左右の列はそのまま） ---- */
#phr { position: absolute; left: 227px; top: 135px; width: 626px; height: 612px; box-sizing: border-box; background: var(--kbg); z-index: 2; opacity: 0; overflow: hidden; padding: 0 6px; }
#phr .cat { color: var(--kacc); font-size: 36px; font-weight: 700; padding: 24px 12px 12px; }
#phr .pr { display: flex; gap: 12px; margin-bottom: 12px; }
#phr .pc { flex: 1; min-width: 0; height: 126px; box-sizing: border-box; border: 1.5px solid var(--kline); border-radius: 9px; padding: 9px 24px; display: flex; flex-direction: column; justify-content: center; position: relative; }
#phr .pc b { font-size: 39px; color: var(--ktext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#phr .pc i { font-style: normal; font-size: 30px; color: var(--ksub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#phr .pc .hl { position: absolute; inset: 0; background: var(--ktext); opacity: 0; border-radius: 7px; }

/* ---- 音声パネル（中央の3列の場所に重なる） ---- */
#voice { position: absolute; left: 227px; top: 135px; width: 626px; height: 612px; background: var(--kbg); z-index: 2; opacity: 0; display: flex; flex-direction: column; padding: 24px 30px; box-sizing: border-box; }
#vState { color: var(--kacc); font-size: 39px; font-weight: 700; }
#vBody { flex: 1; font-size: 42px; color: var(--ktext); line-height: 1.55; padding-top: 14px; }
#vBtns { display: flex; gap: 24px; height: 108px; }
#vBtns div { box-sizing: border-box; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 36px; white-space: nowrap; position: relative; }
#vSub { flex: 1; border: 1.5px solid var(--kline); color: var(--ktext); }
#vMain { flex: 1.6; background: var(--kacc); color: var(--kon); }
#vBtns .hl { position: absolute; inset: 0; background: #E2BE9F; opacity: 0; border-radius: 7px; }

/* ---- タップの輪 ---- */
.tap { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid var(--benihi); border-radius: 50%; opacity: 0; pointer-events: none; z-index: 5; }

/* ---- 場面の言葉（縦書き・右上） ---- */
#cap { right: 70px; top: 150px; height: 780px; }
#capNo { font-family: var(--mincho); color: var(--benihi); font-size: 40px; writing-mode: vertical-rl; letter-spacing: .3em; position: absolute; right: 0; top: 0; }
#capText { position: absolute; right: 74px; top: 0; height: 780px; font-size: 70px; color: var(--tori); }

/* ---- 下の操作（ページで見るとき） ---- */
#ctl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; font-family: var(--gothic); }
#ctl button { background: transparent; color: #E2BE9F; border: 1px solid #656255; border-radius: 2px; padding: 8px 18px; font-size: 14px; font-family: inherit; letter-spacing: .1em; cursor: pointer; }
#bar { width: 180px; height: 2px; background: #656255; }
#barIn { height: 2px; width: 0; background: #E2BE9F; }
</style>
</head>

        <div class="tb" id="tFloat"><svg viewBox="0 0 24 24"><path d="M4,6h12a1.5,1.5 0 0 1 1.5,1.5v8a1.5,1.5 0 0 1 -1.5,1.5h-12a1.5,1.5 0 0 1 -1.5,-1.5v-8a1.5,1.5 0 0 1 1.5,-1.5z"/><path d="M7.5,9.5h5M20.5,10v9a1.5,1.5 0 0 1 -1.5,1.5h-12"/></svg></div>
        <div class="tb" id="tTilt"><svg viewBox="0 0 24 24"><path d="M3.8,11.8h2.6a1,1 0 0 1 1,1v2.6a1,1 0 0 1 -1,1h-2.6a1,1 0 0 1 -1,-1v-2.6a1,1 0 0 1 1,-1z"/><path d="M10.7,7.8h2.6a1,1 0 0 1 1,1v2.6a1,1 0 0 1 -1,1h-2.6a1,1 0 0 1 -1,-1v-2.6a1,1 0 0 1 1,-1z"/><path d="M17.6,11.8h2.6a1,1 0 0 1 1,1v2.6a1,1 0 0 1 -1,1h-2.6a1,1 0 0 1 -1,-1v-2.6a1,1 0 0 1 1,-1z"/><path d="M9,19.5A3.5,3.5 0 0 1 15,19.5"/></svg></div>

<script>
(() => {
  const D = 30;                       // 全体の長さ（秒）
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const ease = (p) => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
  const out = (p) => { p = clamp(p); return 1 - Math.pow(1 - p, 3); };
  const fade = (t, a, b, c, d) => Math.min(out(prog(t, a, b)), 1 - ease(prog(t, c, d)));
  const set = (el, k, v) => { if (el.style[k] !== v) el.style[k] = v; };
  const html = (el, s) => { if (el._h !== s) { el._h = s; el.innerHTML = s; } };

  // ---------- 縦書きの言葉（1文字ずつ出す） ----------
  function chars(el, s) { el.innerHTML = [...s].map((c) => c === "\n" ? "<br>" : `<span>${c}</span>`).join(""); return [...el.querySelectorAll("span")]; }
  const c1 = chars($("copy1"), "言葉を、\n綴る。");
  const c2 = chars($("copy2"), "日本語の、静かなキーボード。");

  // ---------- キー（アプリと同じ並び：左列 ↶ ◀ @ あA1 ／ 中央 12キー ／ 右列 ⌫ ▶ 空白 ↵） ----------
  const SV = (paths, fill) => `<svg viewBox="0 0 24 24">${paths.map((d) => `<path${fill ? ' class="f"' : ""} d="${d}"/>`).join("")}</svg>`;
  const IC = {
    undo: SV(["M8.5,5.5L4,10l4.5,4.5", "M4,10h10a5,5 0 0 1 0,10h-3"]),
    left: SV(["M15,6.5v11L7.5,12z"], true),
    back: SV(["M8.5,5H20a1,1 0 0 1 1,1v12a1,1 0 0 1 -1,1H8.5L3,12z", "M11.5,9.5l5,5M16.5,9.5l-5,5"]),
    right: SV(["M9,6.5v11l7.5,-5.5z"], true),
    space: SV(["M4,10v4h16v-4"]),
    enter: SV(["M19,5v6a3,3 0 0 1 -3,3H5", "M9,10l-4,4 4,4"])
  };
  const LAYOUT = [
    ["undo", "あ", "か", "さ", "back"],
    ["left", "た", "な", "は", "right"],
    ["@", "ま", "や", "ら", "space"],
    ["mode", "小゛゜", "わ", "、。?!", "enter"]
  ];
  const K = {};
  for (const row of LAYOUT) for (const id of row) {
    const d = document.createElement("div");
    d.className = "k" + (id === "小゛゜" || id === "、。?!" ? " s" : "") + (id === "enter" ? " ent" : "");
    d.innerHTML = `<span class="lab"></span><span class="hl"></span>`;
    $("grid").appendChild(d);
    K[id] = d;
  }
  const keys = Object.values(K);
  const gridEl = $("grid");
  const labelOf = (id, st) => {
    if (id === "space") return st.comp ? "変換" : IC.space;
    if (id === "enter") return st.comp ? "確定" : IC.enter;
    if (id === "mode") return '<span class="mode"><b>あ</b> <i>A</i> <i>1</i></span>';
    if (IC[id]) return IC[id];
    return st.flk[id] || id;
  };
  let base = null;
  function measure() { base = keys.map((k) => ({ x: k.offsetLeft + k.offsetWidth / 2, y: k.offsetTop + k.offsetHeight / 2 })); }

  // ---------- 場面 ----------
  const SC = [
    { s: 8.0,  e: 11.0, no: "一", tx: "よく使う文は、<br>ひと触れで。" },
    { s: 11.0, e: 14.5, no: "二", tx: "打ちながら、<br>漢字に。" },
    { s: 14.5, e: 17.5, no: "三", tx: "親指に、<br>沿う。" },
    { s: 17.5, e: 20.5, no: "四", tx: "声を、<br>敬語に。" },
    { s: 20.5, e: 23.5, no: "五", tx: "藍と、<br>鳥の子。" }
  ];

  // おせわになっております（フリック入力 → ライブ変換）
  const FL = [["あ", "お"], ["さ", "せ"], ["わ", "わ"], ["な", "に"], ["な", "な"], ["た", "つ"], ["小゛゜", "っ"], ["た", "て"], ["あ", "お"], ["ら", "り"], ["ま", "ま"], ["さ", "す"]];
  const live = (c) => c.length >= 3 ? "お世話" + c.slice(3) : c;
  const kata = (s) => s.replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));

  function centerOf(el) {
    const sr = $("stage").getBoundingClientRect(), r = el.getBoundingClientRect(), z = sr.width / 1080;
    return [(r.left + r.width / 2 - sr.left) / z, (r.top + r.height / 2 - sr.top) / z];
  }
  const mixc = (a, b, p) => { const A = a.match(/\w\w/g).map((h) => parseInt(h, 16)), B = b.match(/\w\w/g).map((h) => parseInt(h, 16)); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(",")})`; };

  function render(t) {
    // ---- 一枚目 ----
    const m1 = 1 - ease(prog(t, 3.6, 4.1));
    set($("mark"), "opacity", String(m1));
    const ml = $("mLine"); const L = 48;
    ml.setAttribute("stroke-dasharray", L); ml.setAttribute("stroke-dashoffset", String(L * (1 - ease(prog(t, .4, 1.4)))));
    document.querySelectorAll("#mark .st").forEach((e, i) => e.style.opacity = String(out(prog(t, 1.45 + i * .2, 1.75 + i * .2))));
    set($("title"), "opacity", String(Math.min(out(prog(t, 2.3, 3.1)), m1)));
    set($("title"), "transform", `translateY(${(1 - out(prog(t, 2.3, 3.1))) * 24}px)`);
    set($("yomi"), "opacity", String(Math.min(out(prog(t, 2.8, 3.4)), m1)));

    // ---- 二枚目 ----
    set($("copy"), "opacity", String(fade(t, 4.2, 4.4, 7.1, 7.6)));
    c1.forEach((e, i) => { const p = out(prog(t, 4.4 + i * .14, 4.9 + i * .14)); e.style.opacity = String(p); e.style.transform = `translateY(${(1 - p) * -14}px)`; });
    c2.forEach((e, i) => { e.style.opacity = String(out(prog(t, 5.7 + i * .04, 6.1 + i * .04))); });

    // ---- 使っているところ ----
    set($("demo"), "opacity", String(fade(t, 7.6, 8.1, 23.5, 24.0)));
    let sc = SC.findIndex((s) => t >= s.s && t < s.e);
    if (sc < 0) sc = t < SC[0].s ? 0 : SC.length - 1;
    const S = SC[sc], lt = t - S.s;
    html($("capNo"), S.no);
    html($("capText"), S.tx);
    set($("cap"), "opacity", String(fade(t, S.s + .05, S.s + .55, S.e - .45, S.e - .05)));
    set($("cap"), "transform", `translateY(${(1 - out(prog(t, S.s + .05, S.s + .55))) * 18}px)`);

    const st = { field: "", comp: "", cands: [], phr: 0, voice: 0, fan: 0, pal: 0, flk: {}, on: new Set(), prs: new Set() };
    let tapEl = null, tapP = 0;
    const tap = (when, el, hold = 0) => {
      const d = lt - when;
      if (d >= 0 && d < .45) { tapEl = el; tapP = d / .45; }
      if (d >= -hold && d < .2) st.prs.add(el);
    };

    if (sc === 0) {
      // 一 定型文：ツールバーの定型文ボタン → 中央に定型文 → 「来店お礼」をタップ
      tap(.2, $("tPhrase"));
      if (lt >= .2 && lt < 2.6) st.on.add($("tPhrase"));
      st.phr = Math.min(out(prog(lt, .22, .45)), 1 - ease(prog(lt, 2.6, 2.85)));
      tap(1.3, $("pc1"));
      if (lt >= 1.3) st.field = "本日はご来店いただき、ありがとうございます。";
    } else if (sc === 1) {
      // 二 ライブ変換
      const t0 = .35, dt = .15, tEnt = 2.45;
      let comp = "";
      FL.forEach(([k, c], i) => {
        const tt = t0 + i * dt;
        if (lt >= tt) { if (c === "っ") comp = comp.slice(0, -1) + "っ"; else comp += c; }
        tap(tt, K[k]);
        if (lt >= tt && lt < tt + .13 && k !== "小゛゜") st.flk[k] = c;
      });
      if (lt < tEnt) {
        if (comp) { st.comp = live(comp); st.cands = [live(comp), comp, kata(comp)]; }
      } else st.field = "お世話になっております";
      tap(tEnt, K["enter"]);
    } else if (sc === 2) {
      // 三 扇形：ツールバーの扇形ボタン → キーが段違いに
      tap(.25, $("tTilt"));
      tap(2.35, $("tTilt"));
      if (lt >= .25 && lt < 2.35) st.on.add($("tTilt"));
      st.fan = Math.min(ease(prog(lt, .3, .95)), 1 - ease(prog(lt, 2.4, 2.95)));
      tap(1.3, K["た"]); if (lt >= 1.3 && lt < 1.43) st.flk["た"] = "つ";
      tap(1.75, K["か"]); if (lt >= 1.75 && lt < 1.88) st.flk["か"] = "き";
      if (lt >= 1.3 && lt < 2.15) { st.comp = lt >= 1.75 ? "月" : "つ"; st.cands = lt >= 1.75 ? ["月", "付き", "つき", "ツキ"] : ["つ", "ツ"]; }
      tap(2.15, K["enter"]);
      if (lt >= 2.15) st.field = "月";
    } else if (sc === 3) {
      // 四 音声：マイクを長押し（AI添削）→ 聞き取り → 添削して入力
      tap(.45, $("tMic"), .35);
      st.voice = Math.min(out(prog(lt, .45, .65)), 1 - ease(prog(lt, 2.65, 2.9)));
      const raw = "えーと、明日の打ち合わせは10時からでお願いします";
      const fixed = "明日の打ち合わせは10時からでお願いいたします。";
      const tMain = 1.55, tDone = 2.05;
      let state, body, sub, main;
      if (lt < tMain) {
        state = "✨ 聞いています…（AI添削モード）";
        body = raw.slice(0, Math.floor(raw.length * prog(lt, .7, 1.4)));
        sub = "キャンセル"; main = "添削して入力";
      } else if (lt < tDone) {
        state = "✨ AIで添削中…"; body = raw; sub = "キャンセル"; main = "添削中…";
      } else {
        state = "✅ 添削して入力したよ"; body = fixed; sub = "元の文に戻す"; main = "閉じる";
        st.field = fixed;
      }
      html($("vState"), state); html($("vBody"), body); html($("vSubT"), sub); html($("vMainT"), main);
      tap(tMain, $("vMain"));
      $("vMainHl").style.opacity = lt >= tMain && lt < tMain + .2 ? ".25" : "0";
    } else {
      // 五 色：藍 → 鳥の子 → 藍
      st.pal = Math.min(ease(prog(lt, .35, 1.1)), 1 - ease(prog(lt, 2.15, 2.85)));
      st.field = "藍と、鳥の子。";
    }

    // 入力欄（入力中の文字は下線つき）
    html($("ftA"), st.field + (st.comp ? `<span class="comp">${st.comp}</span>` : ""));
    // ツールバー ⇔ 変換候補（入力中はアイコンが消えて候補が並ぶ）
    const composing = !!st.comp;
    set($("tool"), "opacity", composing ? "0" : "1");
    set($("cand"), "opacity", composing ? "1" : "0");
    html($("cand"), st.cands.map((c, i) => `<div class="cc${i === 0 ? " on" : ""}">${c}</div>`).join(""));
    document.querySelectorAll(".tb").forEach((b) => { b.classList.toggle("on", st.on.has(b)); b.classList.toggle("prs", st.prs.has(b) && !st.on.has(b)); });
    // パネル
    set($("phr"), "opacity", String(st.phr));
    set($("voice"), "opacity", String(st.voice));
    document.querySelectorAll("#phr .hl").forEach((e) => e.style.opacity = "0");
    if (st.prs.has($("pc1"))) $("pc1").querySelector(".hl").style.opacity = ".2";
    // キー
    if (!base) measure();
    for (const id in K) {
      const k = K[id];
      html(k.querySelector(".lab"), labelOf(id, st));
      k.querySelector(".hl").style.opacity = st.prs.has(k) ? ".2" : "0";
    }
    // 扇形：右下の下を中心に、親指から遠い列ほど回して段違いに（キーそのものは傾けない）。はみ出す分は縮めて収める
    const W = gridEl.offsetWidth, H = gridEl.offsetHeight, px = W, py = H * 1.6, deg = 8 * Math.PI / 180;
    let pos = null, sfit = 1, lift = 0;
    if (st.fan > 0) {
      pos = keys.map((k, i) => {
        const b = base[i], a = -deg * st.fan * (px - b.x) / W, dx = b.x - px, dy = b.y - py;
        return { x: px + dx * Math.cos(a) - dy * Math.sin(a), y: py + dx * Math.sin(a) + dy * Math.cos(a), hw: k.offsetWidth / 2, hh: k.offsetHeight / 2 };
      });
      for (const q of pos) if (q.x < px) sfit = Math.min(sfit, (px - q.hw - 6) / (px - q.x + q.hw));
      for (const q of pos) lift = Math.max(lift, py - (py - q.y) * sfit + q.hh * sfit - (H - 6));
    }
    keys.forEach((k, i) => {
      if (pos) {
        const b = base[i], q = pos[i];
        k.style.transform = `translate(${px - (px - q.x) * sfit - b.x}px, ${py - (py - q.y) * sfit - b.y - lift}px) scale(${sfit})`;
      } else k.style.transform = "";
    });
    // 配色（藍 ⇔ 鳥の子）：アプリの「藍」「鳥の子」と同じ値
    const kb = $("kb").style;
    kb.setProperty("--kbg", mixc("264348", "E2BE9F", st.pal));
    kb.setProperty("--ktext", mixc("E2BE9F", "264348", st.pal));
    kb.setProperty("--ksub", st.pal > .5 ? "#656255" : "rgba(198,194,182,.7)");
    kb.setProperty("--kon", mixc("264348", "E2BE9F", st.pal));
    // タップの輪
    const tp = $("tap");
    if (tapEl) {
      const [x, y] = centerOf(tapEl);
      tp.style.left = x + "px"; tp.style.top = y + "px";
      tp.style.opacity = String((1 - tapP) * .9);
      tp.style.transform = `scale(${.5 + tapP * .9})`;
    } else tp.style.opacity = "0";

    // ---- 終わり ----
    set($("end"), "opacity", String(out(prog(t, 24.1, 24.6))));
    const el = $("eLine");
    el.setAttribute("stroke-dasharray", L); el.setAttribute("stroke-dashoffset", String(L * (1 - ease(prog(t, 24.3, 25.1)))));
    document.querySelectorAll("#end .est").forEach((e, i) => e.style.opacity = String(out(prog(t, 25.1 + i * .15, 25.35 + i * .15))));
    set($("eTitle"), "opacity", String(out(prog(t, 25.6, 26.4))));
    set($("eYomi"), "opacity", String(out(prog(t, 26.1, 26.7))));
    set($("eRule"), "transform", `scaleX(${out(prog(t, 26.6, 27.2))})`);
    set($("eTag"), "opacity", String(out(prog(t, 26.9, 27.5))));
    set($("eSub"), "opacity", String(out(prog(t, 27.3, 27.9))));

    $("barIn").style.width = (t / D * 100) + "%";
  }

  // ---------- 画面に合わせて縮める ----------
  function fit() {
    const z = Math.min(window.innerWidth / 1080, (window.innerHeight - (window.VIDEO_MODE ? 0 : 60)) / 1920);
    $("wrap").style.transform = `scale(${z})`;
    $("wrap").style.margin = `${(1920 * z - 1920) / 2}px ${(1080 * z - 1080) / 2}px`;
  }
  window.addEventListener("resize", fit);
  fit();

  window.__render = (t) => render(t);
  if (window.VIDEO_MODE) { $("ctl").style.display = "none"; render(0); return; }

  // ---------- ページで見るとき：再生・一時停止 ----------
  let playing = true, t0 = performance.now(), at = 0;
  $("play").textContent = "一時停止";
  $("play").onclick = () => {
    playing = !playing;
    if (playing) t0 = performance.now() - at * 1000;
    $("play").textContent = playing ? "一時停止" : "再生";
  };
  function loop(now) {
    if (playing) { at = ((now - t0) / 1000) % D; }
    render(at);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
