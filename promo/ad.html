<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>綴 コンセプト動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 綴（つづり）コンセプト動画：日本 × ミニマリスト
   色は日本の伝統色だけ（藍色・鳥の子色・甕覗・利休鼠・紅緋）。1080×1920 の縦長で設計 */
:root {
  --ai: #264348;          /* 藍色：背景 */
  --tori: #E2BE9F;        /* 鳥の子色：文字（主） */
  --kame: rgba(198,194,182,.7); /* 甕覗 70%：文字（補足） */
  --rikyu: #656255;       /* 利休鼠：罫線 */
  --benihi: #F35336;      /* 紅緋：見出し・強調 */
  --mincho: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--ai); }
body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
#wrap { width: 1080px; height: 1920px; transform-origin: center center; flex: none; }
#stage { position: relative; width: 1080px; height: 1920px; background: var(--ai); overflow: hidden; color: var(--tori); font-family: var(--gothic); }
.abs { position: absolute; }
.o0 { opacity: 0; }

/* ---- 綴じ糸のしるし（アイコンと同じ形） ---- */
.mark line { stroke-linecap: round; }

/* ---- 表題 ---- */
.title { font-family: var(--mincho); font-weight: 600; color: var(--tori); line-height: 1; }
.yomi { font-family: var(--mincho); color: var(--kame); letter-spacing: .5em; }

/* ---- 縦書きの言葉 ---- */
.tate { writing-mode: vertical-rl; font-family: var(--mincho); line-height: 1.7; letter-spacing: .18em; }
.tate span { display: inline-block; }

/* ---- 入力欄 ---- */
#field { left: 90px; top: 640px; width: 640px; }
#fieldText { font-size: 46px; line-height: 1.6; min-height: 148px; color: var(--tori); letter-spacing: .02em; }
#fieldText .comp { border-bottom: 3px solid var(--tori); }
#fieldText .raw { color: var(--kame); }
#caret { display: inline-block; width: 3px; height: 50px; background: var(--benihi); vertical-align: -8px; margin-left: 4px; }
#fieldLine { height: 2px; background: var(--rikyu); margin-top: 18px; }

/* ---- キーボード ---- */
#kb { left: 0; top: 1000px; width: 1080px; height: 920px; --kbg: #264348; --ktext: #E2BE9F; --kline: #656255; --kon: #264348; background: var(--kbg); }
#kbTop { position: absolute; left: 0; top: 0; width: 1080px; height: 2px; background: var(--kline); }
#tool { position: absolute; left: 40px; right: 40px; top: 20px; height: 90px; display: flex; align-items: center; gap: 46px; }
#tool svg { width: 52px; height: 52px; fill: none; stroke: var(--ktext); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
#tool svg.on { stroke: var(--benihi); opacity: 1; }
#cand { position: absolute; left: 40px; right: 40px; top: 118px; height: 96px; display: flex; align-items: center; gap: 56px; font-size: 44px; color: var(--ktext); border-bottom: 1px solid var(--kline); }
#cand span.sel { border-bottom: 3px solid var(--benihi); padding-bottom: 6px; }
#grid { position: absolute; left: 28px; right: 28px; top: 240px; height: 640px; display: grid; grid-template-columns: .82fr 1fr 1fr 1fr .82fr; grid-template-rows: repeat(4, minmax(0,1fr)); gap: 14px; }
.k { border: 2px solid var(--kline); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 50px; color: var(--ktext); position: relative; will-change: transform; }
.k.s { font-size: 34px; }
.k.ent { background: var(--benihi); border-color: var(--benihi); color: var(--kon); grid-row: span 2; font-size: 40px; letter-spacing: .1em; }
.k .hl { position: absolute; inset: 0; background: var(--ktext); opacity: 0; border-radius: 2px; }
.k .fl { position: absolute; left: 50%; top: -96px; width: 96px; height: 96px; margin-left: -48px; border: 2px solid var(--benihi); background: var(--kbg); color: var(--ktext); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 54px; opacity: 0; z-index: 3; }

/* ---- 定型文パネル ---- */
#phr { position: absolute; left: 40px; right: 40px; top: 230px; height: 660px; opacity: 0; }
#phr .cat { font-family: var(--mincho); color: var(--benihi); font-size: 30px; letter-spacing: .3em; padding: 8px 0 18px; border-bottom: 2px solid var(--kline); }
#phr .row { display: flex; align-items: baseline; justify-content: space-between; padding: 30px 6px; border-bottom: 1px solid var(--kline); position: relative; }
#phr .row b { font-weight: 400; font-size: 40px; color: var(--ktext); }
#phr .row i { font-style: normal; font-size: 28px; color: var(--kame); max-width: 560px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#phr .row .hl { position: absolute; inset: 0; background: var(--ktext); opacity: 0; }

/* ---- 音声パネル ---- */
#voice { position: absolute; left: 0; right: 0; top: 230px; height: 660px; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
#vRing { width: 200px; height: 200px; border-radius: 50%; border: 2px solid var(--benihi); position: relative; display: flex; align-items: center; justify-content: center; }
#vRing2 { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--benihi); }
#vRing svg { width: 80px; height: 80px; fill: none; stroke: var(--tori); stroke-width: 2; stroke-linecap: round; }
#vState { font-family: var(--mincho); font-size: 32px; letter-spacing: .4em; color: var(--kame); }

/* ---- タップの輪 ---- */
.tap { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid var(--benihi); border-radius: 50%; opacity: 0; pointer-events: none; z-index: 5; }

/* ---- 場面の言葉（縦書き・右上） ---- */
#cap { right: 70px; top: 150px; height: 780px; }
#capNo { font-family: var(--mincho); color: var(--benihi); font-size: 40px; writing-mode: vertical-rl; letter-spacing: .3em; position: absolute; right: 0; top: 0; }
#capText { position: absolute; right: 74px; top: 0; height: 780px; font-size: 70px; color: var(--tori); }

/* ---- 下の操作（ページで見るとき） ---- */
#ctl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; font-family: var(--gothic); }
#ctl button { background: transparent; color: #E2BE9F; border: 1px solid #656255; border-radius: 2px; padding: 8px 18px; font-size: 14px; font-family: inherit; letter-spacing: .1em; cursor: pointer; }
#bar { width: 180px; height: 2px; background: #656255; }
#barIn { height: 2px; width: 0; background: #E2BE9F; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">

  <!-- 一枚目：しるしと表題 -->
  <svg id="mark" class="abs mark" viewBox="0 0 108 108" style="left:340px; top:420px; width:400px; height:400px">
    <line id="mLine" x1="54" y1="30" x2="54" y2="78" stroke="#C6C2B6" stroke-width="1.4" />
    <line class="st" x1="46.5" y1="38" x2="61.5" y2="38" stroke="#F35336" stroke-width="3.2" />
    <line class="st" x1="46.5" y1="48.7" x2="61.5" y2="48.7" stroke="#F35336" stroke-width="3.2" />
    <line class="st" x1="46.5" y1="59.3" x2="61.5" y2="59.3" stroke="#F35336" stroke-width="3.2" />
    <line class="st" x1="46.5" y1="70" x2="61.5" y2="70" stroke="#F35336" stroke-width="3.2" />
  </svg>
  <div id="title" class="abs title o0" style="left:0; width:1080px; top:900px; text-align:center; font-size:280px">綴</div>
  <div id="yomi" class="abs yomi o0" style="left:0; width:1080px; top:1230px; text-align:center; font-size:46px; padding-left:.5em">つづり</div>

  <!-- 二枚目：縦書きの言葉 -->
  <div id="copy" class="abs o0" style="left:0; top:0; width:1080px; height:1920px">
    <div id="copy1" class="abs tate" style="left:560px; top:560px; font-size:110px; color:#E2BE9F"></div>
    <div id="copy2" class="abs tate" style="left:420px; top:760px; font-size:44px; color:rgba(198,194,182,.7)"></div>
  </div>

  <!-- 使っているところ -->
  <div id="demo" class="abs o0" style="left:0; top:0; width:1080px; height:1920px">
    <div id="cap" class="abs">
      <div id="capNo"></div>
      <div id="capText" class="tate"></div>
    </div>
    <div id="field" class="abs">
      <div id="fieldText"><span id="ftA"></span><span id="caret"></span></div>
      <div id="fieldLine"></div>
    </div>
    <div id="kb" class="abs">
      <div id="kbTop"></div>
      <div id="tool">
        <svg id="tPhr" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
        <svg id="tFan" viewBox="0 0 24 24"><rect x="2.8" y="11.8" width="4.6" height="4.6" rx="1"/><rect x="9.7" y="7.8" width="4.6" height="4.6" rx="1"/><rect x="16.6" y="11.8" width="4.6" height="4.6" rx="1"/><path d="M9,19.5A3.5,3.5 0 0 1 15,19.5"/></svg>
        <svg id="tMic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        <svg id="tCol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none" style="fill:var(--ktext)"/></svg>
      </div>
      <div id="cand"></div>
      <div id="grid"></div>
      <div id="phr">
        <div class="cat">接客</div>
        <div class="row" id="r1"><b>来店お礼</b><i>本日はご来店いただき、ありがとうございます。</i><span class="hl"></span></div>
        <div class="row"><b>予約確認</b><i>ご予約ありがとうございます。</i><span class="hl"></span></div>
        <div class="row"><b>お待たせ</b><i>大変お待たせいたしました。</i><span class="hl"></span></div>
        <div class="row"><b>承知しました</b><i>承知しました。対応いたします。</i><span class="hl"></span></div>
      </div>
      <div id="voice">
        <div id="vRing"><div id="vRing2"></div><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
        <div id="vState">聞き取り中</div>
      </div>
    </div>
    <div id="tap" class="tap"></div>
  </div>

  <!-- 終わり -->
  <div id="end" class="abs o0" style="left:0; top:0; width:1080px; height:1920px">
    <svg id="eMark" class="abs mark" viewBox="0 0 108 108" style="left:415px; top:470px; width:250px; height:250px">
      <line id="eLine" x1="54" y1="30" x2="54" y2="78" stroke="#C6C2B6" stroke-width="1.4" />
      <line class="est" x1="46.5" y1="38" x2="61.5" y2="38" stroke="#F35336" stroke-width="3.2" />
      <line class="est" x1="46.5" y1="48.7" x2="61.5" y2="48.7" stroke="#F35336" stroke-width="3.2" />
      <line class="est" x1="46.5" y1="59.3" x2="61.5" y2="59.3" stroke="#F35336" stroke-width="3.2" />
      <line class="est" x1="46.5" y1="70" x2="61.5" y2="70" stroke="#F35336" stroke-width="3.2" />
    </svg>
    <div id="eTitle" class="abs title" style="left:0; width:1080px; top:770px; text-align:center; font-size:220px">綴</div>
    <div id="eYomi" class="abs yomi" style="left:0; width:1080px; top:1030px; text-align:center; font-size:40px; padding-left:.5em">つづり</div>
    <div id="eRule" class="abs" style="left:490px; top:1170px; width:100px; height:2px; background:#F35336"></div>
    <div id="eTag" class="abs" style="left:0; width:1080px; top:1220px; text-align:center; font-size:32px; color:rgba(198,194,182,.7); letter-spacing:.35em; padding-left:.35em; font-family:var(--mincho)">定型文　変換　扇形　声</div>
    <div id="eSub" class="abs" style="left:0; width:1080px; top:1300px; text-align:center; font-size:30px; color:rgba(198,194,182,.7); letter-spacing:.3em; padding-left:.3em; font-family:var(--mincho)">言葉を綴る、日本語のキーボード</div>
  </div>

</div></div>

<div id="ctl"><button id="play" type="button">再生</button><div id="bar"><div id="barIn"></div></div></div>

<script>
(() => {
  const D = 30;                       // 全体の長さ（秒）
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const ease = (p) => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
  const out = (p) => { p = clamp(p); return 1 - Math.pow(1 - p, 3); };
  const fade = (t, a, b, c, d) => Math.min(out(prog(t, a, b)), 1 - ease(prog(t, c, d)));
  const set = (el, k, v) => { if (el.style[k] !== v) el.style[k] = v; };
  const html = (el, s) => { if (el._h !== s) { el._h = s; el.innerHTML = s; } };

  // ---------- 縦書きの言葉（1文字ずつ出す） ----------
  function chars(el, s) { el.innerHTML = [...s].map((c) => c === "\n" ? "<br>" : `<span>${c}</span>`).join(""); return [...el.querySelectorAll("span")]; }
  const c1 = chars($("copy1"), "言葉を、\n綴る。");
  const c2 = chars($("copy2"), "日本語の、静かなキーボード。");

  // ---------- キー ----------
  const LAYOUT = [
    ["↶", "あ", "か", "さ", "⌫"],
    ["◀", "た", "な", "は", "空白"],
    ["あA1", "ま", "や", "ら", "確定"],
    ["記号", "小゛゜", "わ", "、。?!"]
  ];
  const K = {};
  for (const row of LAYOUT) for (const lab of row) {
    const d = document.createElement("div");
    d.className = "k" + (lab.length > 2 || lab === "空白" ? " s" : "") + (lab === "確定" ? " ent" : "");
    d.innerHTML = `<span class="lab">${lab}</span><span class="hl"></span><span class="fl"></span>`;
    $("grid").appendChild(d);
    K[lab] = d;
  }
  const keys = Object.values(K);
  const gridEl = $("grid");
  // 扇形のための、もとの位置（キーボードの中の座標）
  let base = null;
  function measure() {
    base = keys.map((k) => ({ x: k.offsetLeft + k.offsetWidth / 2, y: k.offsetTop + k.offsetHeight / 2 }));
  }

  // ---------- 場面 ----------
  const SC = [
    { s: 8.0,  e: 11.0, no: "一", tx: "よく使う文は、<br>ひと触れで。" },
    { s: 11.0, e: 14.5, no: "二", tx: "打ちながら、<br>漢字に。" },
    { s: 14.5, e: 17.5, no: "三", tx: "親指に、<br>沿う。" },
    { s: 17.5, e: 20.5, no: "四", tx: "声を、<br>敬語に。" },
    { s: 20.5, e: 23.5, no: "五", tx: "藍と、<br>鳥の子。" }
  ];

  // おせわになっております（フリック入力 → ライブ変換）
  const FL = [["あ", "お", 4], ["さ", "せ", 3], ["わ", "わ", 0], ["な", "に", 1], ["な", "な", 0], ["た", "つ", 2], ["小゛゜", "っ", 0], ["た", "て", 3], ["あ", "お", 4], ["ら", "り", 1], ["ま", "ま", 0], ["さ", "す", 2]];
  const live = (c) => c.length >= 3 ? "お世話" + c.slice(3) : c;
  const DIRV = [[0, 0], [-1, 0], [0, -1], [1, 0], [0, 1]];

  function keyCenter(k) {
    const sr = $("stage").getBoundingClientRect(), r = k.getBoundingClientRect(), z = sr.width / 1080;
    return [(r.left + r.width / 2 - sr.left) / z, (r.top + r.height / 2 - sr.top) / z];
  }

  function render(t) {
    // ---- 一枚目 ----
    const m1 = 1 - ease(prog(t, 3.6, 4.1));
    set($("mark"), "opacity", String(m1));
    const ml = $("mLine"); const L = 48;
    ml.setAttribute("stroke-dasharray", L); ml.setAttribute("stroke-dashoffset", String(L * (1 - ease(prog(t, .4, 1.4)))));
    document.querySelectorAll("#mark .st").forEach((e, i) => e.style.opacity = String(out(prog(t, 1.45 + i * .2, 1.75 + i * .2))));
    set($("title"), "opacity", String(Math.min(out(prog(t, 2.3, 3.1)), m1)));
    set($("title"), "transform", `translateY(${(1 - out(prog(t, 2.3, 3.1))) * 24}px)`);
    set($("yomi"), "opacity", String(Math.min(out(prog(t, 2.8, 3.4)), m1)));

    // ---- 二枚目 ----
    const cp = fade(t, 4.2, 4.4, 7.1, 7.6);
    set($("copy"), "opacity", String(cp));
    c1.forEach((e, i) => { const p = out(prog(t, 4.4 + i * .14, 4.9 + i * .14)); e.style.opacity = String(p); e.style.transform = `translateY(${(1 - p) * -14}px)`; });
    c2.forEach((e, i) => { e.style.opacity = String(out(prog(t, 5.7 + i * .04, 6.1 + i * .04))); });

    // ---- 使っているところ ----
    const dm = fade(t, 7.6, 8.1, 23.5, 24.0);
    set($("demo"), "opacity", String(dm));
    let sc = SC.findIndex((s) => t >= s.s && t < s.e);
    if (sc < 0) sc = t < SC[0].s ? 0 : SC.length - 1;
    const S = SC[sc], lt = t - S.s;
    // 場面の言葉
    html($("capNo"), S.no);
    html($("capText"), S.tx);
    const cf = fade(t, S.s + .05, S.s + .55, S.e - .45, S.e - .05);
    set($("cap"), "opacity", String(cf));
    set($("cap"), "transform", `translateY(${(1 - out(prog(t, S.s + .05, S.s + .55))) * 18}px)`);

    // いったん全部ふつうに戻す
    let field = "", cands = [], candSel = -1, phr = 0, voice = 0, fan = 0, pal = 0, rawField = false;
    const lit = new Set(); let tapAt = null, tapP = 0; const flk = {};
    ["tPhr", "tFan", "tMic", "tCol"].forEach((id) => $(id).classList.remove("on"));
    const tap = (at, when, el) => { const d = lt - when; if (d >= 0 && d < .45) { tapAt = el; tapP = d / .45; } if (d >= 0 && d < .2) lit.add(el); };

    if (sc === 0) {
      // 一 定型文
      $("tPhr").classList.add("on");
      phr = fade(lt, .25, .6, 2.55, 2.9);
      tap(null, .15, $("tPhr"));
      tap(null, 1.25, $("r1"));
      if (lt >= 1.3) field = "本日はご来店いただき、ありがとうございます。";
    } else if (sc === 1) {
      // 二 ライブ変換
      const t0 = .35, dt = .15, tEnt = 2.45;
      let comp = "";
      FL.forEach(([k, c, d], i) => {
        const tt = t0 + i * dt;
        if (lt >= tt) { if (c === "っ") comp = comp.slice(0, -1) + "っ"; else comp += c; }
        tap(null, tt, K[k]);
        if (d && lt >= tt && lt < tt + .2) flk[k] = c;
      });
      if (lt < tEnt) {
        if (comp) { field = `<span class="comp">${live(comp)}</span>`; cands = [live(comp), comp]; candSel = 0; }
      } else field = "お世話になっております";
      tap(null, tEnt, K["確定"]);
    } else if (sc === 2) {
      // 三 扇形
      $("tFan").classList.toggle("on", lt >= .3 && lt < 2.4);
      tap(null, .25, $("tFan"));
      tap(null, 2.3, $("tFan"));
      fan = Math.min(ease(prog(lt, .35, 1.0)), 1 - ease(prog(lt, 2.4, 2.95)));
      if (lt >= 1.45) field = lt >= 1.85 ? "<span class=\"comp\">月</span>" : "<span class=\"comp\">つ</span>";
      if (lt >= 1.45 && lt < 2.4) { cands = lt >= 1.85 ? ["月", "付き", "つき"] : ["つ", "ツ"]; candSel = 0; }
      if (lt >= 2.4) field = "月";
      tap(null, 1.45, K["た"]); if (lt >= 1.45 && lt < 1.65) flk["た"] = "つ";
      tap(null, 1.85, K["か"]); if (lt >= 1.85 && lt < 2.05) flk["か"] = "き";
    } else if (sc === 3) {
      // 四 声
      $("tMic").classList.add("on");
      tap(null, .15, $("tMic"));
      voice = fade(lt, .2, .5, 2.55, 2.9);
      const raw = "えーと、明日の打ち合わせは10時からでお願いします";
      const fixed = "明日の打ち合わせは10時からでお願いいたします。";
      if (lt < 1.75) { const n = Math.floor(raw.length * prog(lt, .5, 1.5)); if (n) { field = `<span class="raw">${raw.slice(0, n)}</span>`; } }
      else field = fixed;
      html($("vState"), lt < 1.5 ? "聞き取り中" : lt < 1.75 ? "敬語に整える" : "できあがり");
      const pulse = (lt * 1.2) % 1;
      set($("vRing2"), "transform", `scale(${1 + pulse * .45})`);
      set($("vRing2"), "opacity", String(lt < 1.5 ? (1 - pulse) * .8 : 0));
    } else {
      // 五 色
      $("tCol").classList.add("on");
      tap(null, .2, $("tCol"));
      pal = Math.min(ease(prog(lt, .35, 1.1)), 1 - ease(prog(lt, 2.15, 2.85)));
      field = "藍と、鳥の子。";
    }

    // 入力欄
    html($("ftA"), field);
    set($("caret"), "opacity", String(Math.floor(t * 2) % 2 === 0 || field ? 1 : 0));
    // 候補
    html($("cand"), cands.map((c, i) => `<span${i === candSel ? ' class="sel"' : ""}>${c}</span>`).join(""));
    // パネル
    set($("phr"), "opacity", String(phr));
    set($("voice"), "opacity", String(voice));
    set(gridEl, "opacity", String(1 - Math.max(phr, voice)));
    set($("cand"), "opacity", String(1 - Math.max(phr, voice)));
    document.querySelectorAll("#phr .hl").forEach((e) => e.style.opacity = "0");
    if (lit.has($("r1"))) $("r1").querySelector(".hl").style.opacity = ".18";
    // キー
    if (!base) measure();
    const W = gridEl.offsetWidth, H = gridEl.offsetHeight, px = W, py = H * 1.6, deg = 11 * Math.PI / 180;
    // 扇形：右下の下を中心に、親指から遠い列ほど大きく回す（キーそのものは傾けない）
    // 回したあと、はみ出す分だけ中心に向かって全体を縮めて枠に収める
    let pos = null, sfit = 1;
    if (fan > 0) {
      pos = keys.map((k, i) => {
        const b = base[i], a = -deg * fan * (px - b.x) / W, dx = b.x - px, dy = b.y - py;
        return { x: px + dx * Math.cos(a) - dy * Math.sin(a), y: py + dx * Math.sin(a) + dy * Math.cos(a), hw: k.offsetWidth / 2, hh: k.offsetHeight / 2 };
      });
      for (const q of pos) {
        if (q.x < px) sfit = Math.min(sfit, (px - q.hw) / (px - q.x + q.hw));
      }
    }
    // 縮めると中心（下）に寄って下にはみ出すので、はみ出した分だけ上へ戻す
    let lift = 0;
    if (pos) for (const q of pos) lift = Math.max(lift, py - (py - q.y) * sfit + q.hh * sfit - H);
    keys.forEach((k, i) => {
      k.querySelector(".hl").style.opacity = lit.has(k) ? ".22" : "0";
      const f = k.querySelector(".fl"); const lab = Object.keys(K).find((n) => K[n] === k);
      if (flk[lab]) { if (f.textContent !== flk[lab]) f.textContent = flk[lab]; f.style.opacity = "1"; } else f.style.opacity = "0";
      if (pos) {
        const b = base[i], q = pos[i];
        const x = px - (px - q.x) * sfit, y = py - (py - q.y) * sfit;
        k.style.transform = `translate(${x - b.x}px, ${y - b.y - lift}px) scale(${sfit})`;
      } else k.style.transform = "";
    });
    // 配色（藍 ⇔ 鳥の子）
    const mixc = (a, b, p) => { const A = a.match(/\w\w/g).map((h) => parseInt(h, 16)), B = b.match(/\w\w/g).map((h) => parseInt(h, 16)); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(",")})`; };
    const kb = $("kb").style;
    kb.setProperty("--kbg", mixc("264348", "E2BE9F", pal));
    kb.setProperty("--ktext", mixc("E2BE9F", "264348", pal));
    kb.setProperty("--kon", mixc("264348", "E2BE9F", pal));
    // タップの輪
    const tp = $("tap");
    if (tapAt) {
      const [x, y] = keyCenter(tapAt);
      tp.style.left = x + "px"; tp.style.top = y + "px";
      tp.style.opacity = String((1 - tapP) * .9);
      tp.style.transform = `scale(${.5 + tapP * .9})`;
    } else tp.style.opacity = "0";

    // ---- 終わり ----
    const en = out(prog(t, 24.1, 24.6));
    set($("end"), "opacity", String(en));
    const el = $("eLine");
    el.setAttribute("stroke-dasharray", L); el.setAttribute("stroke-dashoffset", String(L * (1 - ease(prog(t, 24.3, 25.1)))));
    document.querySelectorAll("#end .est").forEach((e, i) => e.style.opacity = String(out(prog(t, 25.1 + i * .15, 25.35 + i * .15))));
    set($("eTitle"), "opacity", String(out(prog(t, 25.6, 26.4))));
    set($("eYomi"), "opacity", String(out(prog(t, 26.1, 26.7))));
    set($("eRule"), "transform", `scaleX(${out(prog(t, 26.6, 27.2))})`);
    set($("eTag"), "opacity", String(out(prog(t, 26.9, 27.5))));
    set($("eSub"), "opacity", String(out(prog(t, 27.3, 27.9))));

    $("barIn").style.width = (t / D * 100) + "%";
  }

  // ---------- 画面に合わせて縮める ----------
  function fit() {
    const z = Math.min(window.innerWidth / 1080, (window.innerHeight - (window.VIDEO_MODE ? 0 : 60)) / 1920);
    $("wrap").style.transform = `scale(${z})`;
    $("wrap").style.margin = `${(1920 * z - 1920) / 2}px ${(1080 * z - 1080) / 2}px`;
  }
  window.addEventListener("resize", fit);
  fit();

  window.__render = (t) => render(t);
  if (window.VIDEO_MODE) { $("ctl").style.display = "none"; render(0); return; }

  // ---------- ページで見るとき：再生・一時停止 ----------
  let playing = true, t0 = performance.now(), at = 0;
  $("play").textContent = "一時停止";
  $("play").onclick = () => {
    playing = !playing;
    if (playing) t0 = performance.now() - at * 1000;
    $("play").textContent = playing ? "一時停止" : "再生";
  };
  function loop(now) {
    if (playing) { at = ((now - t0) / 1000) % D; }
    render(at);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
