name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ランナーに最初から入っているAndroid SDKを使う
      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 変換辞書：Mozc OSS辞書（固定バージョン）から作る。作ったものはキャッシュして使い回す
      - name: Cache dictionary
        id: dictcache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/dict.db
            app/src/main/assets/conn.bin
          key: dict2-d766d25d-${{ hashFiles('tools/build_dict.py') }}

      - name: Build dictionary
        if: steps.dictcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/mozc && cd /tmp/mozc
          git init -q
          git remote add origin https://github.com/google/mozc.git
          git sparse-checkout set src/data/dictionary_oss
          git fetch -q --depth 1 --filter=blob:none origin d766d25d253141eff71e25c593aaf753f8d91cee
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets
          python3 tools/build_dict.py /tmp/mozc/src/data/dictionary_oss app/src/main/assets/dict.db app/src/main/assets/conn.bin

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kooky-keyboard-debug
          path: app/build/outputs/apk/debug/*.apk

      # アプリのアップデートボタンから直接ダウンロードできるようにReleaseへ置く
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: app/build/outputs/apk/debug/app-debug.apk
